name: Scheduled Portfolio Metadata Synchronization

on:
  schedule:
    # Run once every 24 hours at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Public GitHub Repositories
        run: npm run sync:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Build
        run: npm run build

      - name: Commit & Push Changes If Cache Changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Sync Engine]"
          git add src/data/github-cache.json
          git diff --staged --quiet || (git commit -m "chore(sync): automated repository sync [skip ci]" && git push)
